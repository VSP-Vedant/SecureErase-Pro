################################################################################
# SecureErase Pro — Production Nginx Configuration
# Hardened TLS, security headers, rate limiting, reverse proxy
################################################################################

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time"';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;   # do not expose nginx version

    # ── Gzip compression ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        font/ttf
        font/opentype
        image/svg+xml;

    # ── Rate limiting zones ──────────────────────────────────────────────────
    # Zone: public verification endpoints — 10 req/min per IP
    limit_req_zone $binary_remote_addr zone=verify_public:10m rate=10r/m;

    # Zone: authentication endpoints — 5 req/min per IP (brute force protection)
    limit_req_zone $binary_remote_addr zone=auth_endpoints:10m rate=5r/m;

    # Zone: general API — 60 req/min per IP
    limit_req_zone $binary_remote_addr zone=general_api:10m rate=60r/m;

    # Rate limit response
    limit_req_status 429;

    # ── Client constraints ───────────────────────────────────────────────────
    # 10 MB for certificate JSON uploads (from Phase 9 spec)
    client_max_body_size 10m;

    # ── Upstream definitions ─────────────────────────────────────────────────
    upstream portal_backend {
        server portal-backend:8000;
        keepalive 32;
    }

    upstream portal_frontend {
        server portal-frontend:80;
        keepalive 16;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Certbot ACME challenge passthrough (used when Let's Encrypt is enabled)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # All other traffic → permanent redirect to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS server ──────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # ── TLS configuration ─────────────────────────────────────────────
        # Replace with Let's Encrypt paths when certbot is enabled:
        #   ssl_certificate     /etc/letsencrypt/live/${PORTAL_DOMAIN}/fullchain.pem;
        #   ssl_certificate_key /etc/letsencrypt/live/${PORTAL_DOMAIN}/privkey.pem;
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # TLS 1.2 and 1.3 ONLY — TLS 1.0 and 1.1 disabled
        ssl_protocols TLSv1.2 TLSv1.3;

        # Strong cipher suites — ECDHE preferred, no RC4/DES/3DES/MD5
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;   # Let clients pick from strong list

        # Session resumption (performance without compromising FS)
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP stapling for faster revocation checks
        ssl_stapling        on;
        ssl_stapling_verify on;
        resolver            1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout    5s;

        # ── Security headers ──────────────────────────────────────────────

        # HSTS: force HTTPS for 1 year including subdomains
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Prevent framing (clickjacking protection)
        add_header X-Frame-Options "DENY" always;

        # Prevent MIME type sniffing
        add_header X-Content-Type-Options "nosniff" always;

        # Referrer policy — send origin only on same-origin, nothing on cross-origin
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Permissions policy — disable unused browser features
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

        # Content-Security-Policy
        # - default-src 'self': only load resources from our domain
        # - script-src: allow inline scripts from our frontend build
        # - img-src: allow data URIs for QR codes
        # - connect-src: allow API calls back to ourselves
        # - frame-ancestors 'none': equivalent to X-Frame-Options DENY
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # ── Proxy timeout settings ────────────────────────────────────────
        proxy_connect_timeout       10s;
        proxy_send_timeout          60s;
        proxy_read_timeout          60s;
        proxy_buffering             on;
        proxy_buffer_size           8k;
        proxy_buffers               8 64k;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # ── API routes → portal-backend ──────────────────────────────────

        # Authentication endpoints — stricter rate limit
        location /api/v1/auth/ {
            limit_req zone=auth_endpoints burst=3 nodelay;
            proxy_pass http://portal_backend;
        }

        # Public verification endpoints — 10 req/min
        location ~ ^/api/v1/verify/ {
            limit_req zone=verify_public burst=5 nodelay;
            proxy_pass http://portal_backend;
        }

        # Certificate registry registration — 30 req/min (desktop app uploads)
        location /api/v1/registry/ {
            limit_req zone=general_api burst=10 nodelay;
            proxy_pass http://portal_backend;
        }

        # All other API routes — general rate limit
        location /api/ {
            limit_req zone=general_api burst=20 nodelay;
            proxy_pass http://portal_backend;
        }

        # ── All other traffic → portal-frontend ──────────────────────────
        location / {
            limit_req zone=general_api burst=30 nodelay;
            proxy_pass http://portal_frontend;
            # SPA fallback: serve index.html for all frontend routes
            proxy_intercept_errors on;
            error_page 404 = /index.html;
        }

        # ── Static asset caching ──────────────────────────────────────────
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://portal_frontend;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
