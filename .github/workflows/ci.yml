name: CI/CD Pipeline

on:
  push:
    branches: [main, dev, "feature/**"]
  pull_request:
    branches: [main, dev]

jobs:

  # ── Job 1: Desktop module tests ──────────────────────────────────────────
  test-desktop:
    name: Desktop Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desktop/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r desktop/requirements.txt pytest pytest-cov

      - name: Run tests
        run: pytest desktop/tests/ -v --tb=short --cov=desktop/modules --cov-report=xml

      - uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          flags: desktop

  # ── Job 2: Portal backend unit tests ─────────────────────────────────────
  test-portal:
    name: Portal Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: portal/backend/requirements.txt

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libzbar0

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r portal/backend/requirements.txt pytest pytest-cov httpx

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-only-minimum-32-characters
          JWT_SECRET: test-jwt-secret-for-ci-only-minimum-32-characters
          COLUMN_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          IP_HASH_SALT: test-ip-hash-salt-for-ci-only
        run: pytest portal/backend/tests/ -v --tb=short --cov=portal/backend/modules --cov-report=xml

      - uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          flags: portal

  # ── Job 3: Frontend production build ─────────────────────────────────────
  test-frontend:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portal/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: portal/frontend/dist/
          retention-days: 7

  # ── Job 4: Build Docker images ───────────────────────────────────────────
  # Runs on any PR, or on push to main/dev
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-desktop, test-portal, test-frontend]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: portal/backend
          push: false
          tags: secureerase-portal-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: portal/frontend
          push: false
          tags: secureerase-portal-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 5: Trivy security scan (PRs to main only) ─────────────────────────
  # Docker images don't persist between jobs — rebuild using the GHA layer cache.
  security-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Rebuild backend for scanning
        uses: docker/build-push-action@v5
        with:
          context: portal/backend
          load: true
          tags: secureerase-portal-backend:scan
          cache-from: type=gha

      - name: Rebuild frontend for scanning
        uses: docker/build-push-action@v5
        with:
          context: portal/frontend
          load: true
          tags: secureerase-portal-frontend:scan
          cache-from: type=gha

      - name: Trivy scan - backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secureerase-portal-backend:scan
          format: table
          exit-code: "1"
          severity: CRITICAL

      - name: Trivy scan - frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secureerase-portal-frontend:scan
          format: table
          exit-code: "1"
          severity: CRITICAL

  # ── Job 6: Deploy to staging (push to dev) ───────────────────────────────
  # Skips gracefully if STAGING_HOST / STAGING_SSH_KEY secrets are not set.
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test-desktop, test-portal, test-frontend]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          if [ -z "${STAGING_HOST}" ] || [ -z "${STAGING_SSH_KEY}" ]; then
            echo "STAGING_HOST or STAGING_SSH_KEY not configured - skipping deploy."
            echo "Configure them at: repo Settings > Secrets and variables > Actions"
            exit 0
          fi
          echo "${STAGING_SSH_KEY}" > /tmp/deploy_key && chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no deploy@${STAGING_HOST} \
            "cd /opt/secureerase && git pull origin dev && \
             docker compose -f infra/docker-compose.yml up -d --build && \
             docker compose -f infra/docker-compose.yml exec portal-backend \
             python -m alembic -c migrations/alembic.ini upgrade head"
          rm -f /tmp/deploy_key

  # ── Job 7: Deploy to production (push to main) ───────────────────────────
  # Skips gracefully if PROD_HOST / PROD_SSH_KEY secrets are not set.
  # Security: branch protection on main must require security-scan to pass
  # before any PR can merge, ensuring all prod deployments passed the scan.
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test-desktop, test-portal, test-frontend, build-images]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://verify.yourdomain.com
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          if [ -z "${PROD_HOST}" ] || [ -z "${PROD_SSH_KEY}" ]; then
            echo "PROD_HOST or PROD_SSH_KEY not configured - skipping deploy."
            echo "Configure them at: repo Settings > Secrets and variables > Actions"
            exit 0
          fi
          echo "${PROD_SSH_KEY}" > /tmp/deploy_key && chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no deploy@${PROD_HOST} \
            "cd /opt/secureerase && git pull origin main && \
             docker compose -f infra/docker-compose.yml up -d --build && \
             docker compose -f infra/docker-compose.yml exec portal-backend \
             python -m alembic -c migrations/alembic.ini upgrade head"
          rm -f /tmp/deploy_key
